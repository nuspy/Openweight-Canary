[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openweight-canary"
version = "0.1.0"
description = "Black-box canary test that looks for data leaks and exfiltration by an open-weight LLM behind an HTTP API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
openweight-canary = "canary.cli:main"

[tool.setuptools]
packages = ["canary"]

[tool.setuptools.package-data]
canary = ["vendors.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
